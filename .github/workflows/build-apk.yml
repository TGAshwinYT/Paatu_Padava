name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze 2>&1 | tee analyze.txt

      - name: Run Unit Tests
        working-directory: mobile
        run: flutter test

      - name: Upload Analysis Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: mobile/analyze.txt

      - name: Validate Supabase Secrets
        run: |
          RAW_URL="${{ secrets.SUPABASE_URL }}"
          RAW_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          URL=$(printf '%s' "$RAW_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          FAILED=0
          echo "== Validating Supabase Secrets =="

          if [ -z "$URL" ]; then
            echo "::error::SUPABASE_URL secret is missing in GitHub repository secrets!"
            FAILED=1
          else
            if echo "$URL" | grep -q "['\"]"; then
              echo "::error::SUPABASE_URL contains quote characters. Please remove any single or double quotes in GitHub Secrets."
              FAILED=1
            fi

            C_URL=$(printf '%s' "$URL" | tr -d ' "\x27' | sed 's:/*$::')
            if ! echo "$C_URL" | grep -Eq "^https://[a-zA-Z0-9-]+\.supabase\.co$"; then
              echo "::error::SUPABASE_URL must look like https://<project-ref>.supabase.co (e.g. https://bdolimatfkyqibiedlqp.supabase.co). Got: '$URL'"
              FAILED=1
            fi
          fi

          if [ -z "$KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is missing in GitHub repository secrets!"
            FAILED=1
          else
            if echo "$KEY" | grep -q "['\"]"; then
              echo "::error::SUPABASE_ANON_KEY contains quote characters. Please remove any single or double quotes in GitHub Secrets."
              FAILED=1
            fi

            C_KEY=$(printf '%s' "$KEY" | tr -d ' "\x27')
            if ! echo "$C_KEY" | grep -Eq "^eyJ"; then
              echo "::error::SUPABASE_ANON_KEY should be the public 'anon' JWT starting with 'eyJ...'. Please ensure you did not copy the service-role key or an invalid string."
              FAILED=1
            fi
          fi

          if [ $FAILED -ne 0 ]; then
            echo "::error::Build aborted. Valid Supabase secrets are required to produce a functional release APK."
            exit 1
          fi

          echo "✅ All Supabase secrets verified and ready for injection."

      - name: Setup Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secrets into upload-keystore.jks..."
            echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=app/upload-keystore.jks\n" \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > mobile/android/key.properties
            echo "✅ Configured permanent release keystore and key.properties."
          else
            echo "⚠️ KEYSTORE_BASE64 is not configured in repository secrets."
          fi

      - name: Build Release APK
        working-directory: mobile
        run: |
          GIT_SHA="${{ github.sha }}"
          SHORT_SHA="${GIT_SHA:0:7}"
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')

          CLEAN_URL=$(printf '%s' "${{ secrets.SUPABASE_URL }}" | tr -d '\r\n "' | sed "s/'//g" | sed 's:/*$::')
          CLEAN_KEY=$(printf '%s' "${{ secrets.SUPABASE_ANON_KEY }}" | tr -d '\r\n "' | sed "s/'//g")
          SPOTIFY_ID=$(printf '%s' "${{ secrets.SPOTIFY_CLIENT_ID }}" | tr -d '\r\n "' | sed "s/'//g")
          SPOTIFY_SECRET=$(printf '%s' "${{ secrets.SPOTIFY_CLIENT_SECRET }}" | tr -d '\r\n "' | sed "s/'//g")

          echo "Building APK with Git commit: $SHORT_SHA ($BUILD_TIME, run #${{ github.run_number }})..."

          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES: Building release APK..."
            if flutter build apk --release -t lib/main.dart --android-skip-build-dependency-validation \
                --build-number=${{ github.run_number }} \
                --dart-define=SUPABASE_URL="$CLEAN_URL" \
                --dart-define=SUPABASE_ANON_KEY="$CLEAN_KEY" \
                --dart-define=SPOTIFY_CLIENT_ID="$SPOTIFY_ID" \
                --dart-define=SPOTIFY_CLIENT_SECRET="$SPOTIFY_SECRET" \
                --dart-define=GIT_COMMIT="$SHORT_SHA" \
                --dart-define=BUILD_TIME="$BUILD_TIME"; then
              echo "✅ APK built successfully on attempt $i!"
              break
            else
              if [ "$i" -lt "$MAX_RETRIES" ]; then
                echo "⚠️ Build attempt $i failed (likely transient network/CDN timeout). Retrying in 10s..."
                sleep 10
              else
                echo "❌ Build failed after $MAX_RETRIES attempts."
                exit 1
              fi
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paatu-padava-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
