name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze 2>&1 | tee analyze.txt

      - name: Run Unit Tests
        working-directory: mobile
        run: flutter test

      - name: Upload Analysis Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: mobile/analyze.txt

      - name: Validate Supabase Secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::warning::SUPABASE_URL is not set in GitHub repository secrets! Mobile cloud sync will run in offline mode."
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::warning::SUPABASE_ANON_KEY is not set in GitHub repository secrets! Mobile cloud sync will run in offline mode."
          fi

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paatu-padava-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
