name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze 2>&1 | tee analyze.txt

      - name: Run Unit Tests
        working-directory: mobile
        run: flutter test

      - name: Upload Analysis Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: mobile/analyze.txt

      - name: Validate Supabase Secrets
        run: |
          RAW_URL="${{ secrets.SUPABASE_URL }}"
          RAW_KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          URL=$(printf '%s' "$RAW_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          FAILED=0
          echo "== Validating Supabase Secrets =="

          if [ -z "$URL" ]; then
            echo "::error::SUPABASE_URL secret is missing in GitHub repository secrets!"
            FAILED=1
          else
            if echo "$URL" | grep -q "['\"]"; then
              echo "::error::SUPABASE_URL contains quote characters. Please remove any single or double quotes in GitHub Secrets."
              FAILED=1
            fi

            C_URL=$(printf '%s' "$URL" | tr -d ' "\x27' | sed 's:/*$::')
            if ! echo "$C_URL" | grep -Eq "^https://[a-zA-Z0-9-]+\.supabase\.co$"; then
              echo "::error::SUPABASE_URL must look like https://<project-ref>.supabase.co (e.g. https://bdolimatfkyqibiedlqp.supabase.co). Got: '$URL'"
              FAILED=1
            fi
          fi

          if [ -z "$KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is missing in GitHub repository secrets!"
            FAILED=1
          else
            if echo "$KEY" | grep -q "['\"]"; then
              echo "::error::SUPABASE_ANON_KEY contains quote characters. Please remove any single or double quotes in GitHub Secrets."
              FAILED=1
            fi

            C_KEY=$(printf '%s' "$KEY" | tr -d ' "\x27')
            if ! echo "$C_KEY" | grep -Eq "^eyJ"; then
              echo "::error::SUPABASE_ANON_KEY should be the public 'anon' JWT starting with 'eyJ...'. Please ensure you did not copy the service-role key or an invalid string."
              FAILED=1
            fi
          fi

          if [ $FAILED -ne 0 ]; then
            echo "::error::Build aborted. Valid Supabase secrets are required to produce a functional release APK."
            exit 1
          fi

          echo "✅ All Supabase secrets verified and ready for injection."

      - name: Build Release APK
        working-directory: mobile
        run: |
          GIT_SHA="${{ github.sha }}"
          SHORT_SHA="${GIT_SHA:0:7}"
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')

          CLEAN_URL=$(printf '%s' "${{ secrets.SUPABASE_URL }}" | tr -d '\r\n "' | sed "s/'//g" | sed 's:/*$::')
          CLEAN_KEY=$(printf '%s' "${{ secrets.SUPABASE_ANON_KEY }}" | tr -d '\r\n "' | sed "s/'//g")

          echo "Building APK with Git commit: $SHORT_SHA ($BUILD_TIME)..."

          flutter build apk --release -t lib/main.dart --android-skip-build-dependency-validation --dart-define=SUPABASE_URL="$CLEAN_URL" --dart-define=SUPABASE_ANON_KEY="$CLEAN_KEY" --dart-define=GIT_COMMIT="$SHORT_SHA" --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paatu-padava-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
