name: Test Build iOS

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target to build for testing'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'ipa'
          - 'simulator'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios-test.yml'

jobs:
  build-ios-test:
    name: Build iOS Test Artifacts
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate Native iOS App Icons
        run: |
          echo "== Generating iOS App Icons from assets/logo.png using macOS sips =="
          ICON_SRC="mobile/assets/logo.png"
          ICON_DIR="mobile/ios/Runner/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"

          sips -z 20 20 "$ICON_SRC" --out "$ICON_DIR/Icon-App-20x20@1x.png"
          sips -z 40 40 "$ICON_SRC" --out "$ICON_DIR/Icon-App-20x20@2x.png"
          sips -z 60 60 "$ICON_SRC" --out "$ICON_DIR/Icon-App-20x20@3x.png"
          sips -z 29 29 "$ICON_SRC" --out "$ICON_DIR/Icon-App-29x29@1x.png"
          sips -z 58 58 "$ICON_SRC" --out "$ICON_DIR/Icon-App-29x29@2x.png"
          sips -z 87 87 "$ICON_SRC" --out "$ICON_DIR/Icon-App-29x29@3x.png"
          sips -z 40 40 "$ICON_SRC" --out "$ICON_DIR/Icon-App-40x40@1x.png"
          sips -z 80 80 "$ICON_SRC" --out "$ICON_DIR/Icon-App-40x40@2x.png"
          sips -z 120 120 "$ICON_SRC" --out "$ICON_DIR/Icon-App-40x40@3x.png"
          sips -z 120 120 "$ICON_SRC" --out "$ICON_DIR/Icon-App-60x60@2x.png"
          sips -z 180 180 "$ICON_SRC" --out "$ICON_DIR/Icon-App-60x60@3x.png"
          sips -z 76 76 "$ICON_SRC" --out "$ICON_DIR/Icon-App-76x76@1x.png"
          sips -z 152 152 "$ICON_SRC" --out "$ICON_DIR/Icon-App-76x76@2x.png"
          sips -z 167 167 "$ICON_SRC" --out "$ICON_DIR/Icon-App-83.5x83.5@2x.png"
          sips -z 1024 1024 "$ICON_SRC" --out "$ICON_DIR/Icon-App-1024x1024@1x.png"
          echo "✅ Generated all 15 iOS app icon resolutions successfully."

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Build Unsigned iOS IPA (Device Testing)
        if: ${{ github.event.inputs.build_target == 'ipa' || github.event.inputs.build_target == 'both' || github.event_name == 'pull_request' }}
        working-directory: mobile
        run: |
          GIT_SHA="${{ github.sha }}"
          SHORT_SHA="${GIT_SHA:0:7}"
          BUILD_TIME=$(date -u +'%Y-%m-%d_%H:%M_UTC')

          CLEAN_URL=$(printf '%s' "${{ secrets.SUPABASE_URL }}" | tr -d '\r\n "' | sed "s/'//g" | sed 's:/*$::')
          CLEAN_KEY=$(printf '%s' "${{ secrets.SUPABASE_ANON_KEY }}" | tr -d '\r\n "' | sed "s/'//g")
          SPOTIFY_ID=$(printf '%s' "${{ secrets.SPOTIFY_CLIENT_ID }}" | tr -d '\r\n "' | sed "s/'//g")
          SPOTIFY_SECRET=$(printf '%s' "${{ secrets.SPOTIFY_CLIENT_SECRET }}" | tr -d '\r\n "' | sed "s/'//g")

          echo "Building iOS release bundle without codesign..."
          flutter build ios --release --no-codesign -t lib/main.dart \
            "--dart-define=SUPABASE_URL=$CLEAN_URL" \
            "--dart-define=SUPABASE_ANON_KEY=$CLEAN_KEY" \
            "--dart-define=SPOTIFY_CLIENT_ID=$SPOTIFY_ID" \
            "--dart-define=SPOTIFY_CLIENT_SECRET=$SPOTIFY_SECRET" \
            "--dart-define=GIT_COMMIT=$SHORT_SHA" \
            "--dart-define=BUILD_TIME=$BUILD_TIME"

          echo "Packaging into test IPA..."
          mkdir -p build/ios/test-ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/test-ipa/Payload/
          cd build/ios/test-ipa
          zip -qr PaatuPadava-iOS-Test.ipa Payload
          echo "✅ Packaged PaatuPadava-iOS-Test.ipa for AltStore/Sideloadly testing."

      - name: Upload Test IPA
        if: ${{ github.event.inputs.build_target == 'ipa' || github.event.inputs.build_target == 'both' || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: paatu-padava-ios-test-ipa-FOR-PHYSICAL-IPHONES-ONLY
          path: mobile/build/ios/test-ipa/PaatuPadava-iOS-Test.ipa
          retention-days: 14

      - name: Build iOS Simulator App (Appetize.io Compatible)
        if: ${{ github.event.inputs.build_target == 'simulator' || github.event.inputs.build_target == 'both' }}
        working-directory: mobile
        run: |
          GIT_SHA="${{ github.sha }}"
          SHORT_SHA="${GIT_SHA:0:7}"
          BUILD_TIME=$(date -u +'%Y-%m-%d_%H:%M_UTC')

          CLEAN_URL=$(printf '%s' "${{ secrets.SUPABASE_URL }}" | tr -d '\r\n "' | sed "s/'//g" | sed 's:/*$::')
          CLEAN_KEY=$(printf '%s' "${{ secrets.SUPABASE_ANON_KEY }}" | tr -d '\r\n "' | sed "s/'//g")
          SPOTIFY_ID=$(printf '%s' "${{ secrets.SPOTIFY_CLIENT_ID }}" | tr -d '\r\n "' | sed "s/'//g")
          SPOTIFY_SECRET=$(printf '%s' "${{ secrets.SPOTIFY_CLIENT_SECRET }}" | tr -d '\r\n "' | sed "s/'//g")

          echo "Building iOS Simulator bundle for Appetize.io..."
          flutter build ios --simulator --debug -t lib/main.dart \
            "--dart-define=SUPABASE_URL=$CLEAN_URL" \
            "--dart-define=SUPABASE_ANON_KEY=$CLEAN_KEY" \
            "--dart-define=SPOTIFY_CLIENT_ID=$SPOTIFY_ID" \
            "--dart-define=SPOTIFY_CLIENT_SECRET=$SPOTIFY_SECRET" \
            "--dart-define=GIT_COMMIT=$SHORT_SHA" \
            "--dart-define=BUILD_TIME=$BUILD_TIME"

          echo "Simulator build finished. Validating Runner.app..."
          ls -la build/ios/iphonesimulator/Runner.app

          echo "Packaging Runner.app into Runner.zip with symlinks for Appetize.io..."
          cd build/ios/iphonesimulator
          zip -ry Runner.zip Runner.app
          echo "✅ Packaged Appetize-compatible Runner.zip successfully."

      - name: Upload Appetize.io Ready Bundle
        if: ${{ github.event.inputs.build_target == 'simulator' || github.event.inputs.build_target == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: appetize-ios-simulator-build
          path: mobile/build/ios/iphonesimulator/Runner.zip
          retention-days: 14
