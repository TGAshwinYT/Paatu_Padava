include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # --- Ratchet: these used to be `ignore`. They now surface as `info` so they
    # show up in `flutter analyze` without failing CI (CI uses --no-fatal-infos).
    # Fix them gradually, then raise to `warning` and finally `error`.
    use_build_context_synchronously: info   # common cause of "crash after await"
    cancel_subscriptions: info              # leaked stream subscriptions (audio!)
    close_sinks: info

    # --- Still ignored (noise): revisit later.
    deprecated_member_use: ignore
    use_super_parameters: ignore
    prefer_const_constructors: ignore
    unnecessary_to_list_in_spreads: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - scratch_*.dart
    - "**/scratch_*.dart"

linter:
  rules:
    - use_build_context_synchronously
    - cancel_subscriptions
    - close_sinks
