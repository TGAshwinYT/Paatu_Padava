name: Full Stack CI / CD Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Test Suite (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: backend-data-hf
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Unit Tests
        working-directory: backend-data-hf
        run: |
          python -m unittest discover -s tests

  frontend-build:
    name: Frontend Build (React 19 / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install Dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Build React Application
        working-directory: frontend-react
        run: npm run build

  mobile-tests:
    name: Mobile Test Suite (Flutter SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Flutter Static Analysis
        working-directory: mobile
        run: flutter analyze

      - name: Run Mobile Unit & Widget Tests
        working-directory: mobile
        run: flutter test
