name: Sync to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Configure Git
        run: |
          git config user.email "tgashwinyt@gmail.com"
          git config user.name "TGAshwinYT"

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Create a clean orphan branch containing only the current files (no historical LFS pointers)
          git checkout --orphan hf-sync
          git commit -m "Deploy Paatu Padava to Hugging Face Spaces"
          
          # Add HF remote and force-push to main
          git remote add hf https://TGAshwinYT:$HF_TOKEN@huggingface.co/spaces/TGAshwinYT/Paatu_Padava || true
          git push hf hf-sync:main --force
